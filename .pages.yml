# Admin panel configuration for Pages CMS (https://pagescms.org).
# Sign in at https://app.pagescms.org with GitHub, open this repository and
# edit content with forms. Every save is a commit; the site redeploys itself.

media:
  input: public/media
  output: /media
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif, svg]

content:
  - name: site
    label: Company & contact details
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: company, label: Company name, type: string, required: true }
      - { name: brand, label: Short brand name, type: string, required: true }
      - { name: phone, label: Phone, type: string, required: true, description: "International format, e.g. +34 692 643 322" }
      - { name: email, label: Email, type: string, required: true }
      - { name: whatsapp, label: Show WhatsApp button (uses the phone number), type: boolean }
      - name: address
        label: Address
        type: object
        fields:
          - { name: street, label: Street, type: string }
          - { name: locality, label: Town, type: string }
          - { name: region, label: Province, type: string }
          - { name: postalCode, label: Postal code, type: string }
      - { name: taxId, label: CIF / tax ID (shown on legal pages), type: string }
      - { name: registryDetails, label: Mercantile registry details (legal pages), type: string, description: "e.g. Registro Mercantil de Málaga, Tomo X, Folio Y, Hoja MA-Z" }
      - { name: contactFormKey, label: Web3Forms access key, type: string, description: "Free key from web3forms.com. Leave empty and the form opens the visitor's email app instead." }
      - { name: profiles, label: Official profiles (Google Business, LinkedIn, Instagram…), type: string, list: true, pattern: { regex: '^https://.+', message: 'Must start with https://' }, description: "Full profile URLs. Helps Google and AI assistants recognise these accounts as this company." }
      - name: verification
        label: Search engine verification
        type: object
        fields:
          - { name: google, label: Google Search Console code, type: string, description: 'Only the content="…" value of the HTML tag. Not needed if you verify by DNS.' }
          - { name: bing, label: Bing Webmaster Tools code, type: string, description: 'Only the content="…" value of the msvalidate.01 tag.' }

  - name: home-en
    label: Home page texts (English)
    type: file
    path: src/data/en/home.json
    format: json
    fields:
      - name: meta
        label: General
        type: object
        fields:
          - { name: title, label: SEO title (browser tab and Google), type: string, required: true, description: "About 50–60 characters. Put the most important words first." }
          - { name: description, label: SEO description, type: text, description: "About 140–160 characters, shown under the title in Google." }
          - { name: availability, label: Availability badge, type: string }
          - { name: availabilityDetail, label: Availability text (contact section), type: text }
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Small line above the title, type: string }
          - { name: titleBefore, label: Title, type: string }
          - { name: titleAccent, label: Title (italic accent part), type: string }
          - { name: lead, label: Intro text, type: text }
          - { name: primaryCta, label: Main button, type: string }
          - { name: secondaryCta, label: Second button, type: string }
      - { name: marquee, label: Scrolling ticker words, type: string, list: true }
      - name: company
        label: '"A company, not a freelancer" section'
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: titleAccent, label: Title (italic accent part), type: string }
          - { name: lead, label: Text, type: text }
          - name: points
            label: Points
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
      - name: services
        label: Services
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: titleAccent, label: Title (italic accent part), type: string }
          - name: items
            label: Services
            type: object
            list: true
            fields:
              - { name: letter, label: Big letter, type: string, pattern: '^.{1,2}$' }
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
      - name: process
        label: Process
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - name: steps
            label: Steps
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
      - name: pricing
        label: Pricing
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: titleAccent, label: Title (italic accent part), type: string }
          - { name: lead, label: Text, type: text }
          - { name: points, label: Bullet points, type: string, list: true }
          - { name: cta, label: Button, type: string }
      - name: faq
        label: FAQ
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }

