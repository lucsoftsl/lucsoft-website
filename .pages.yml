  - name: reviews
    label: Reviews
    type: file
    path: src/data/reviews.json
    format: json
    list: true
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: role, label: Company / role (optional), type: string }
      - { name: rating, label: Stars (1-5), type: number, required: true, options: { min: 1, max: 5 } }
      - name: language
        label: Language the review was written in
        type: select
        required: true
        options: { values: [en, es] }
      - { name: text, label: Review (original words), type: text, required: true }
      - { name: translation, label: Translation into the other language (optional), type: text }
      - { name: featured, label: Highlight (dark card), type: boolean }

  - name: work-en
    label: Portfolio (English)
    type: collection
    path: src/content/work/en
    format: yaml-frontmatter
    description: Use the same file name in the English and Spanish folders for the same project.
    view:
      fields: [client, category, published]
      sort: [order]
    fields:
      - { name: client, label: Client name, type: string, required: true }
      - { name: title, label: Case study headline, type: string, required: true }
      - { name: url, label: Live website URL, type: string, required: true, pattern: { regex: '^https?://.+', message: 'Must start with https://' } }
      - { name: category, label: Category, type: string, required: true }
      - { name: location, label: Location, type: string }
      - { name: year, label: Year, type: string }
      - { name: summary, label: Short summary (card), type: text, required: true }
      - { name: cover, label: Cover photo, type: image, required: true }
      - { name: screenshot, label: Desktop screenshot (16:10), type: image }
      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - { name: src, label: Image, type: image, required: true }
          - { name: alt, label: Description (for accessibility), type: string, required: true }
      - { name: appStore, label: App Store link (native app, optional), type: string, description: "e.g. https://apps.apple.com/app/id1234567890. Leave empty if there is no iOS app." }
      - { name: googlePlay, label: Google Play link (native app, optional), type: string, description: "e.g. https://play.google.com/store/apps/details?id=com.example. Leave empty if there is no Android app." }
      - name: appScreens
        label: App screenshots (shown in phone frames)
        type: object
        list: true
        fields:
          - { name: src, label: Screenshot (portrait phone screen), type: image, required: true }
          - { name: alt, label: Description (for accessibility), type: string, required: true }
      - { name: services, label: Features / what's inside, type: string, list: true }
      - { name: accent, label: Accent colour (hex), type: string }
      - { name: order, label: Order (1 = first), type: number }
      - { name: published, label: Published, type: boolean }
      - { name: body, label: Case study text, type: rich-text }

